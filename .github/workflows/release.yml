name: Release
on:
  push:
    tags: ["v*"]

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: core
          repository: Muxcore-Media/core
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          path: health-monitor
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Build binaries
        working-directory: ./health-monitor
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/health-monitor-linux-amd64 ./cmd/module
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/health-monitor-linux-arm64 ./cmd/module
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./health-monitor
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/health-monitor:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/health-monitor:latest
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: health-monitor/dist/*
          generate_release_notes: true
